[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
# 队列后端（互斥开启其一；默认 pg）：
#   pg      → worker_jobs 表落在业务 Postgres（生产）
#   sqlite  → worker_jobs 表落在本地 sqlite 文件（单机部署 / 不想跑 Postgres 的场景，
#             仅支持单进程消费）
default = ["pg"]
pg = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
futures-util = { workspace = true }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
