[package]
name = "appctx"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
test-utils = [
    "jwt/test-utils",
    "blob/test-utils",
    "flow/test-utils",
    "cache/test-utils",
    "queue/test-utils",
]
# 缓存后端转发（由 bin/server 的 kv-redb / kv-redis 统一开启；testing.rs 固定用测试 PG 池，
# 不随 kv-* 切换后端，各后端正确性由 cache crate 单测覆盖）
kv-pg = ["cache/pg"]
kv-redb = ["cache/redb"]
kv-redis = ["cache/redis"]

[dependencies]
axum = { workspace = true }
http_client = { workspace = true }
jwt = { workspace = true }
db = { workspace = true }
blob = { workspace = true }
tracing = { workspace = true }
flow = { workspace = true }
cache = { workspace = true }
queue = { workspace = true }
