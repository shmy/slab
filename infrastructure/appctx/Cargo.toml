[package]
name = "appctx"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
test-utils = [
    "jwt/test-utils",
    "blob/test-utils",
    "flow/test-utils",
    "kv/test-utils",
    "event_bus/test-utils",
]
# 缓存后端转发（由 bin/server 的 kv-redb / kv-redis 统一开启；testing.rs 固定用测试 PG 池，
# 不随 kv-* 切换后端，各后端正确性由 kv crate 单测覆盖）
kv-pg = ["kv/pg"]
kv-redb = ["kv/redb"]
kv-redis = ["kv/redis"]

[dependencies]
axum = { workspace = true }
http_client = { workspace = true }
jwt = { workspace = true }
db = { workspace = true }
blob = { workspace = true }
tracing = { workspace = true }
flow = { workspace = true }
kv = { workspace = true }
event_bus = { workspace = true }
job_queue = { workspace = true }
