[package]
name = "appctx"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[lints]
workspace = true

[features]
test-utils = [
    "jwt/test-utils",
    "blob/test-utils",
    "flow/test-utils",
    "dep:tempfile",
    "kv-pg",
]
# 缓存后端转发（由 bin/server 的 kv-redb / kv-redis 统一开启；testing.rs 据此选择测试后端）
kv-pg = ["cache/pg"]
kv-redb = ["cache/redb"]
kv-redis = ["cache/redis"]

[dependencies]
axum = { workspace = true }
http_client = { workspace = true }
jwt = { workspace = true }
db = { workspace = true }
blob = { workspace = true }
tracing = { workspace = true }
flow = { workspace = true }
cache = { workspace = true }
queue = { workspace = true }
tempfile = { version = "3", optional = true }
