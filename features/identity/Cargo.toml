[package]
name = "identity"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[features]
# 缓存后端转发（与 server/appctx 的 kv-* 模式一致）：测试选择后端，如 `cargo test -p identity --features kv-redb`
kv-redb = ["appctx/kv-redb"]
kv-redis = ["appctx/kv-redis"]

[dependencies]
appctx = { workspace = true }
audit_contract = { workspace = true }
authn_kit = { workspace = true }
axum = { workspace = true }
kv = { workspace = true }
db = { workspace = true }
feature = { workspace = true }
futures-util = { workspace = true }
http_auth = { workspace = true }
identity_contract = { workspace = true }
queue = { workspace = true }
rootcause = { workspace = true }
sea-query = { workspace = true }
sea-query-sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
shared_contract = { workspace = true }
sqlx = { workspace = true }
tempoid = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
validify = { workspace = true }
web = { workspace = true }

[dev-dependencies]
appctx = { workspace = true, features = ["test-utils"] }
migration = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
