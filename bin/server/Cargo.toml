[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "main.rs"

[features]
default = ["kv-pg", "queue-nats"]
# 缓存后端（互斥，开启其一）：
#   kv-pg  → cache::Backend::Pg（PostgreSQL，跨实例共享）
#   kv-redb  → cache::Backend::Redb（嵌入式，单实例）
#   kv-redis → cache::Backend::Redis（bb8，跨实例共享）
kv-pg = ["cache/pg", "appctx/kv-pg"]
kv-redb = ["cache/redb", "appctx/kv-redb"]
kv-redis = ["cache/redis", "appctx/kv-redis"]
# 队列后端（互斥，开启其一；默认 queue-pg）：
#   queue-pg  → queue::Backend::Pg（Outbox 表 + 进程内 dispatcher，与业务同事务）
#   queue-nats → queue::Backend::Nats（JetStream 直发，延迟用 ADR-51 schedule）
queue-pg = ["queue/pg"]
queue-nats = ["queue/nats"]

[dependencies]
cache = { workspace = true }
db = { workspace = true }
blob = { workspace = true }
queue = { workspace = true }
axum = { workspace = true }
axum-governor = { workspace = true }
axum-tracing-opentelemetry = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
file = { workspace = true }
health = { workspace = true }
http_auth = { workspace = true }
humantime = { workspace = true }
locale = { workspace = true }
lazy-limit = { workspace = true }
migration = { workspace = true }
feature = { workspace = true }
mimalloc = { workspace = true }
rootcause = { workspace = true }
sched_kit = { workspace = true }
secrecy = { workspace = true }
appctx = { workspace = true }
audit = { workspace = true }
customer = { workspace = true }
finance = { workspace = true }
identity = { workspace = true }
item = { workspace = true }
supplier = { workspace = true }
warehouse = { workspace = true }
purchase = { workspace = true }
quality = { workspace = true }
sales = { workspace = true }
planning = { workspace = true }
product = { workspace = true }
production = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
trace_kit = { workspace = true, features = ["console", "otlp"] }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }

[dev-dependencies]
