[package]
name = "server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "main.rs"

[features]
default = ["kv-redis", "event-bus-pg", "worker-sqlite", "blob-cos"]
# 缓存后端（互斥，开启其一）：
#   kv-pg  → kv::KvBackend::Pg（PostgreSQL，跨实例共享）
#   kv-redb  → kv::KvBackend::Redb（嵌入式，单实例）
#   kv-redis → kv::KvBackend::Redis（bb8，跨实例共享）
kv-pg = ["kv/pg", "appctx/kv-pg"]
kv-redb = ["kv/redb", "appctx/kv-redb"]
kv-redis = ["kv/redis", "appctx/kv-redis"]
# 事件总线后端（互斥，开启其一；默认 event-bus-pg）：
#   event-bus-pg  → event_bus::EventBus::Pg（Outbox 表 + 进程内 dispatcher，与业务同事务）
#   event-bus-nats → event_bus::EventBus::Nats（JetStream 直发，延迟用 ADR-51 schedule）
event-bus-pg = ["event_bus/pg"]
event-bus-nats = ["event_bus/nats"]
# blob 后端（互斥，开启其一；默认 blob-cos）：
#   blob-cos → blob::Blob::Cos（腾讯云 COS / S3 兼容对象存储）
#   blob-fs  → blob::Blob::Fs（本地文件系统，开发环境）
# 注意：cos 随 blob 默认特性恒在；blob-fs 开启时 cos 分支让位（与 event-bus-pg/event-bus-nats 同构），
# 双开时 config.rs 取 fs 分支、cli 的 s3 参数组消失。
blob-cos = ["blob/cos"]
blob-fs = ["blob/fs"]

worker-sqlite = ["worker/sqlite"]
worker-pg = ["worker/pg"]

[dependencies]
kv = { workspace = true }
worker = { workspace = true }
db = { workspace = true }
blob = { workspace = true }
event_bus = { workspace = true }
axum = { workspace = true }
axum-governor = { workspace = true }
axum-tracing-opentelemetry = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
file = { workspace = true }
health = { workspace = true }
http_auth = { workspace = true }
humantime = { workspace = true }
locale = { workspace = true }
lazy-limit = { workspace = true }
migration = { workspace = true }
module = { workspace = true }
mimalloc = { workspace = true }
rootcause = { workspace = true }
sched_kit = { workspace = true }
secrecy = { workspace = true }
appctx = { workspace = true }
audit = { workspace = true }
customer = { workspace = true }
finance = { workspace = true }
identity = { workspace = true }
item = { workspace = true }
supplier = { workspace = true }
warehouse = { workspace = true }
purchase = { workspace = true }
quality = { workspace = true }
sales = { workspace = true }
planning = { workspace = true }
product = { workspace = true }
production = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
trace_kit = { workspace = true, features = ["console", "otlp"] }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }

[dev-dependencies]
toml = "0.8"
